{% extends "base.html" %}

{% block title %}上传头像 - 用户管理系统{% endblock %}

{% block content %}
<div class="card">
    <h2 class="card-title">上传头像</h2>

    {% if error %}
        <div class="error-message">{{ error }}</div>
    {% endif %}

    <form action="/upload" method="post" enctype="multipart/form-data">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="file">选择头像文件：</label>
            <input type="file" id="file" name="file" class="file-input" accept="image/*">
        </div>
        <button type="submit" class="btn btn-primary">上传</button>
    </form>

    {% if success %}
        <div class="success-message">{{ success }}</div>
        <div class="upload-preview">
            <h3>头像预览</h3>
            <img src="{{ file_url }}" alt="头像预览">
            <p>
                <a href="{{ file_url }}" target="_blank" class="nav-link">{{ file_url }}</a>
            </p>
        </div>
    {% endif %}

    <div class="action-bar" style="margin-top: 20px;">
        <a href="/" class="btn btn-primary">返回首页</a>
    </div>
</div>
{% endblock %}
