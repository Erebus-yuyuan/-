{% extends "base.html" %}

{% block title %}用户注册{% endblock %}

{% block content %}
<div class="card login-card">
    <h2 class="card-title">用户注册</h2>
    <form method="POST" action="/register" class="login-form">
        {% if error %}
            <div class="error-message">{{ error }}</div>
        {% endif %}
        {% if success %}
            <div class="success-message">{{ success }}</div>
        {% endif %}
        <div class="form-group">
            <label for="username">用户名</label>
            <input type="text" id="username" name="username" class="form-input" placeholder="请输入用户名（至少2个字符）" required>
        </div>
        <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" name="password" class="form-input" placeholder="请输入密码（至少6位）" required>
        </div>
        <div class="form-group">
            <label for="confirm_password">确认密码</label>
            <input type="password" id="confirm_password" name="confirm_password" class="form-input" placeholder="请再次输入密码" required>
        </div>
        <div class="form-group">
            <label for="email">邮箱</label>
            <input type="email" id="email" name="email" class="form-input" placeholder="请输入邮箱（选填）">
        </div>
        <div class="form-group">
            <label for="phone">手机号</label>
            <input type="text" id="phone" name="phone" class="form-input" placeholder="请输入手机号（选填）">
        </div>
        <button type="submit" class="btn btn-primary">注 册</button>
    </form>
    <div class="form-footer">
        已有账号？<a href="/login" class="link">去登录</a>
    </div>
</div>
{% endblock %}
