{% extends "base.html" %}

{% block title %}修改密码{% endblock %}

{% block content %}
<div class="card login-card">
    <h2 class="card-title">修改密码</h2>
    <form method="POST" action="/change-password" class="login-form">
        {% if error %}
            <div class="error-message">{{ error }}</div>
        {% endif %}
        {% if success %}
            <div class="success-message">{{ success }}</div>
        {% endif %}
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="old_password">原密码</label>
            <input type="password" id="old_password" name="old_password" class="form-input" placeholder="请输入原密码" required>
        </div>
        <div class="form-group">
            <label for="new_password">新密码</label>
            <input type="password" id="new_password" name="new_password" class="form-input" placeholder="请输入新密码（至少6位）" required>
        </div>
        <div class="form-group">
            <label for="confirm_password">确认新密码</label>
            <input type="password" id="confirm_password" name="confirm_password" class="form-input" placeholder="请再次输入新密码" required>
        </div>
        <button type="submit" class="btn btn-primary">修改密码</button>
    </form>
    <div class="form-footer">
        <a href="/" class="link">返回首页</a>
    </div>
</div>
{% endblock %}
