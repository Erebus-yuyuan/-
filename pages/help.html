<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>帮助中心</title>
</head>
<body>
    <h1>帮助中心</h1>
    <div class="help-section">
        <h2>常见问题</h2>
        <div class="faq-item">
            <h3>如何注册账号？</h3>
            <p>点击导航栏的"注册"按钮，填写用户名、密码、邮箱和手机号即可完成注册。</p>
        </div>
        <div class="faq-item">
            <h3>如何修改密码？</h3>
            <p>登录后，点击导航栏的"修改密码"，输入原密码和新密码即可完成修改。</p>
        </div>
        <div class="faq-item">
            <h3>如何上传头像？</h3>
            <p>登录后，点击导航栏的"上传头像"，选择图片文件并上传即可。</p>
        </div>
        <div class="faq-item">
            <h3>如何查询用户信息？</h3>
            <p>登录后，在首页即可查看您的用户信息，或点击"个人中心"查看详细资料。</p>
        </div>
    </div>
</body>
</html>
